<ideogram>

<spacing>
	default = 0.003r

	<pairwise hs40 hs1>
		spacing = 10r
	</pairwise>

</spacing>

# Ideogram position, fill and outline
radius           = 0.85r
thickness        = 5p
fill             = yes
stroke_thickness = 1
stroke_color     = dgrey

# Minimum definition for ideogram labels.
show_label       = yes
# see etc/fonts.conf for list of font names
label_font       = default 
label_radius     = 1.020r  # if ideogram radius is constant, and you'd like labels close to image edge, 
                           # use the dims() function to access the size of the image
                           # label_radius  = dims(image,radius) - 60p
label_size       = 10
label_parallel   = no

#<<include bands.conf>>
#<<include highband.conf>>

</ideogram>
